<!doctype html>
<html
  lang="en"
  class="bg-surface text-primary scroll-smooth scrollbar-thin scrollbar-thumb-surface-2"
>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Task Manager</title>
    <link
      rel="shortcut icon"
      href="/task-manager/assets/favicon-ROy7OiOR.ico"
      type="image/x-icon"
    />

    <script>
      (() => {
        const savedTheme = localStorage.getItem("theme") || "dark";
        const root = document.documentElement;

        root.classList.toggle("dark", savedTheme === "dark");
        root.classList.toggle("light", savedTheme === "light");
      })();
    </script>
    <script type="module" crossorigin src="/task-manager/assets/index-7yZkvikA.js"></script>
    <link rel="stylesheet" crossorigin href="/task-manager/assets/index-AzhjBdAu.css">
  <link rel="manifest" href="/task-manager/manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="/task-manager/registerSW.js"></script></head>

  <body class="min-h-screen bg-surface text-primary">
    <!-- ============================= -->
    <!-- APP CONTAINER START -->
    <!-- ============================= -->

    <div
      id="app-loader"
      class="fixed inset-0 z-9999 grid place-items-center"
    >
      <div class="loader">
        <div class="loader-small"></div>
        <div class="loader-large"></div>
      </div>
    </div>

    <div
      id="app"
      class="hidden px-8 py-12 lg:ps-8 transition-all duration-300"
    >
      <div id="header-container"></div>

      <div id="desktop-nav-container"></div>

      <div id="tasks-view-container"></div>

      <div id="analytics-view-container"></div>

      <div id="calendar-view-container"></div>

      <div id="matrix-view-container"></div>

      <div id="settings-view-container"></div>

      <div id="edit-modals-container"></div>

      <div id="delete-modals-container"></div>

      <div id="help-modal-container"></div>

      <div
        id="notification-container"
        class="fixed bottom-6 left-1/2 -translate-x-1/2 z-400 flex flex-col gap-3 min-w-80 max-w-md"
      ></div>
    </div>

    <!-- ============================= -->
    <!-- APP CONTAINER END -->
    <!-- ============================= -->

    <div id="mobile-nav-container"></div>

    <button
      id="scroll-to-top-btn"
      class="fixed bottom-24 lg:bottom-6 right-6 z-40 hidden opacity-0 scale-75 h-10 w-10 cursor-pointer items-center justify-center rounded-lg bg-brand/70 text-white shadow-lg transition duration-400 hover:bg-(--color-brand-hover) hover:scale-110"
      title="Scroll to top"
    >
      <i class="fa-regular fa-chevron-up text-lg"></i>
    </button>

    <script src="./vendor/fontawesome/js/all.js"></script>
  </body>
</html>
